name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o Aura.zip -d .

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: cd Aura && gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aura-debug-apk
          path: Aura/app/build/outputs/apk/debug/app-debug.apk
